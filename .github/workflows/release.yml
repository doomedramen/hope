# Release. Runs only for pushed version tags; there is no manual trigger. The tagged commit must be
# reachable from main. Untrusted code never reaches this workflow, and the signing key exists only in
# the protected `release` environment, which only the publish job uses (configure required reviewers
# and restrict the environment to v* tags in the repository settings).
#
# Direct external actions are pinned to full release commit SHAs; review and exercise changes in
# GitHub Actions before using this workflow for a production release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag must be a version tag on a commit that is on main
        run: |
          case "${GITHUB_REF}" in refs/tags/v*) ;; *) echo "not a version tag: ${GITHUB_REF}"; exit 1 ;; esac
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || { echo "${GITHUB_SHA} is not an ancestor of origin/main"; exit 1; }
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"; exit 1; }

  build:
    needs: guard
    uses: ./.github/workflows/build-agent.yml

  build-server:
    # Server packages for install-hope.sh: the release binary plus the console export, per
    # architecture, on the oldest supported glibc (Ubuntu 22.04) so newer distributions can run them.
    needs: guard
    name: server ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
      - run: sh scripts/package-server.sh --out dist/server
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-${{ matrix.arch }}
          path: dist/server/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [guard, build, build-server]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release # holds the HOPE_SIGNING_KEY secret (RSA private key PEM) with required reviewers
    permissions:
      contents: write # create the GitHub release
      id-token: write # build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: agent-*
          path: dist/agents
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server-x86_64
          path: dist/server-builds/server-x86_64
      - name: Verify the final server package checksums
        run: |
          # The unsigned agents too, for install-hope.sh and ct/hope.sh, which sign with each server's own key.
          mkdir -p dist/server
          tar -C dist/agents --owner=0 --group=0 --numeric-owner --sort=name -czf dist/server/hope-agents.tar.gz .
          sh scripts/assemble-server-release.sh --staging dist/server-builds --out dist/server
      - name: Assemble, sign and verify (fails unless Linux x86_64 is present)
        env:
          SIGNING_KEY_PEM: ${{ secrets.HOPE_SIGNING_KEY }}
        run: |
          umask 077
          key="$RUNNER_TEMP/release-signing-key.pem"
          printf '%s\n' "$SIGNING_KEY_PEM" > "$key"
          trap 'rm -f "$key"' EXIT
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          HOPE_SIGNING_KEY="$key" sh scripts/assemble-release.sh --staging dist/agents --version "$version" --out "$RUNNER_TEMP/release"
          mkdir -p "$RUNNER_TEMP/publish"
          cp -L "$RUNNER_TEMP"/release/current/* "$RUNNER_TEMP/publish/"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/publish/hope-agent-*
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --verify-tag \
            "$RUNNER_TEMP"/publish/hope-agent-* "$RUNNER_TEMP"/publish/manifest.json "$RUNNER_TEMP"/publish/manifest.json.sig "$RUNNER_TEMP"/publish/release-public.pem \
            dist/server/hope-server-*-linux.tar.gz dist/server/hope-agents.tar.gz dist/server/SHA256SUMS-server
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-release
          path: ${{ runner.temp }}/publish/
          retention-days: 30
