name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-checks:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hope
          POSTGRES_PASSWORD: hope
          POSTGRES_DB: hope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hope"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://hope:hope@localhost:5432/hope
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace -- --test-threads=1

  web:
    name: web build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/web lint
      - run: pnpm -C apps/web test -- --run
      - run: pnpm -C apps/web build

  agent-cross-compile:
    name: agent cross-compile, sign, and release bundle (amd64 musl)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: rustup target add "${{ matrix.target }}"
      - uses: Swatinem/rust-cache@v2
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: taiki-e/install-action@cargo-zigbuild

      # Release signing key: use repo secrets if configured (real
      # releases), otherwise generate an ephemeral CI-only keypair so the
      # pipeline still exercises signing + verification end-to-end on
      # every PR. An ephemeral key means these CI-signed binaries are
      # NOT trusted by any real agent build -- see docs/release-signing.md.
      - name: Resolve signing key
        run: |
          mkdir -p ci-release-keys
          if [ -n "${{ secrets.HOPE_RELEASE_SIGNING_KEY_HEX }}" ]; then
            echo "${{ secrets.HOPE_RELEASE_SIGNING_KEY_HEX }}" > ci-release-keys/signing-key.hex
            echo "${{ secrets.HOPE_RELEASE_PUBLIC_KEY_HEX }}" > ci-release-keys/public-key.hex
            echo "Using repository-configured release signing key."
          else
            cargo run -p xtask -- keygen --out ci-release-keys
            echo "::warning::No HOPE_RELEASE_SIGNING_KEY_HEX secret configured; signed with an ephemeral CI-only key. These binaries are not trustable as a real release."
          fi

      - name: Build agent (with embedded release public key)
        env:
          HOPE_RELEASE_PUBLIC_KEY_FILE: ${{ github.workspace }}/ci-release-keys/public-key.hex
        run: cargo zigbuild --release -p agent --target ${{ matrix.target }}

      - name: Sign release
        run: |
          cargo run -p xtask -- sign \
            --version "0.0.0-ci.${{ github.sha }}" \
            --key ci-release-keys/signing-key.hex \
            --out dist/release \
            --artifact "target/${{ matrix.target }}/release/agent=linux=${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: agent-release-linux-${{ matrix.arch }}
          path: dist/release

  docker-build:
    name: build and publish server image
    runs-on: ubuntu-latest
    needs: [rust-checks, web]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=long

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/compose/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
