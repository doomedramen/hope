# Continuous integration. Untrusted pull-request code runs here, so this workflow has read-only
# permissions and references no secrets. Signing exists only in release.yml.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.96.0"

jobs:
  rust-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal -c rustfmt -c clippy
          rustup default "$RUST_VERSION"
      # Dependencies and build artifacts, keyed by toolchain, lockfile and job. Pull requests write only
      # to their own scope; main's cache seeds them.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  rust-test:
    name: rust-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      # Dependencies and build artifacts, keyed by toolchain, lockfile and job. Pull requests write only
      # to their own scope; main's cache seeds them.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --locked

  protocol-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      # Dependencies and build artifacts, keyed by toolchain, lockfile and job. Pull requests write only
      # to their own scope; main's cache seeds them.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: make types
      - name: Generated protocol must match the committed file
        run: git diff --exit-code -- web/lib/protocol.ts

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      # Dependencies and build artifacts, keyed by toolchain, lockfile and job. Pull requests write only
      # to their own scope; main's cache seeds them.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: npm --prefix web ci
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run lint
      - run: npm --prefix web run build
      - run: cargo build --locked -p hope-server
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm --prefix web run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Syntax check (sh -n)
        run: |
          for f in scripts/*.sh; do echo "sh -n $f"; sh -n "$f"; done
      - name: ShellCheck
        run: |
          shellcheck -s sh scripts/*.sh
          shellcheck -s bash -e SC1090,SC1091,SC2154,SC2164 ct/*.sh install/*.sh
      - name: Installer harness
        run: make installer-tests
      - name: Release assembly tests
        run: make release-tests

  discovery-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: docker build -t hope:ci .
      - name: Linux discovery fixture (one on-link run)
        run: python3 scripts/benchmark-discovery.py --image hope:ci --runs 1 --on-link --output target/discovery-ci.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: discovery-ci
          path: target/discovery-ci.json
          retention-days: 7

  server-package:
    # Builds the actual server release package and exercises its download, checksum, layout,
    # systemd activation, repeat install and rollback paths inside a disposable runner container.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      # Dependencies and build artifacts, keyed by toolchain, lockfile and job. Pull requests write only
      # to their own scope; main's cache seeds them.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: sh scripts/package-server.sh --out dist/server
      - run: cd dist/server && sha256sum -c SHA256SUMS-server
      - run: python3 -I -m unittest discover -s tests/installer -p 'test_server_installer.py' -v
      - name: Server-install systemd readiness unit tests
        run: python3 -I -m unittest discover -s tests/gates -p 'test_server_install_gate.py' -v
      - name: Real Debian systemd server install, repeat activation and rollback
        run: tests/gates/run.sh server-install --package-dir dist/server

  updater-gate:
    # The agent updater under real systemd: a Debian 13 container with systemd as PID 1, the real
    # server behind a TLS proxy with a throwaway CA, and releases signed with throwaway keys. Installs
    # an agent with the console's command, updates it from the console, and checks the no-op, wrong-key,
    # rollback and uninstall paths. The container is privileged; the runner is disposable.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      # Dependencies and build artifacts, keyed by toolchain, lockfile and job. Pull requests write only
      # to their own scope; main's cache seeds them.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install Linux musl toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends musl-tools binutils
      - run: tests/gates/run.sh updater

  release-build-smoke:
    if: github.event_name != 'push'
    uses: ./.github/workflows/build-agent.yml

  verify-signing-flow:
    # Exercises assemble-release.sh with a throwaway key generated on the runner, from the smoke
    # build's x86_64 Linux artifact.
    if: github.event_name != 'push'
    needs: release-build-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: agent-*
          path: dist/agents
          merge-multiple: true
      - name: Assemble and verify with an ephemeral key
        run: |
          key="$RUNNER_TEMP/ci-signing-key.pem"
          openssl genrsa -out "$key" 3072
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          HOPE_SIGNING_KEY="$key" sh scripts/assemble-release.sh --staging dist/agents --version "$version" --out "$RUNNER_TEMP/release"
          cat "$RUNNER_TEMP/release/current/manifest.json"
