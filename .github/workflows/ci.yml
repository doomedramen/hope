name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  proxmox-helper:
    name: Proxmox helper scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-proxmox-helper.sh

  rust-checks:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hope
          POSTGRES_PASSWORD: hope
          POSTGRES_DB: hope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hope"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://hope:hope@localhost:5432/hope
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace -- --test-threads=1

  web:
    name: web build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/web lint
      - run: pnpm -C apps/web test -- --run
      - run: pnpm -C apps/web build

  web-e2e:
    name: browser smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hope
          POSTGRES_PASSWORD: hope
          POSTGRES_DB: hope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hope"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HOPE_DATABASE_URL: postgres://hope:hope@localhost:5432/hope
      E2E_BASE_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: cargo build -p server
      - name: Create disposable E2E signing key
        run: cargo run -p xtask -- keygen --out "$RUNNER_TEMP/hope-e2e-release-keys"
      - name: Build agent for the disposable target
        env:
          HOPE_RELEASE_PUBLIC_KEY_FILE: ${{ runner.temp }}/hope-e2e-release-keys/public-key.hex
          HOPE_AGENT_RELEASE_VERSION: 0.1.0
        run: cargo build -p agent --release
      - name: Sign disposable agent bundle
        run: |
          cargo run -p xtask -- sign --version 0.1.0 --key "$RUNNER_TEMP/hope-e2e-release-keys/signing-key.hex" --public-key "$RUNNER_TEMP/hope-e2e-release-keys/public-key.hex" --out "$RUNNER_TEMP/hope-e2e-releases" --artifact target/release/agent=linux=amd64
      - run: pnpm -C apps/web build
      - name: Initialize server PKI
        run: |
          e2e_pki_dir="$RUNNER_TEMP/hope-e2e-pki"
          mkdir -p "$e2e_pki_dir"
          openssl rand -hex 32 >"$RUNNER_TEMP/hope-e2e-master-key"
          HOPE_CA_CERT_PATH="$e2e_pki_dir/ca-cert.pem" \
          HOPE_CA_KEY_PATH="$e2e_pki_dir/ca-key.pem" \
          HOPE_SERVER_CERT_PATH="$e2e_pki_dir/server-cert.pem" \
          HOPE_SERVER_KEY_PATH="$e2e_pki_dir/server-key.pem" \
          ./target/debug/server ca init
      - name: Start server
        run: |
          export HOPE_WEB_DIST_DIR=apps/web/dist
          export HOPE_BIND_ADDR=0.0.0.0:8080
          export HOPE_TLS_BIND_ADDR=0.0.0.0:18443
          export HOPE_COOKIE_SECURE=false
          export HOPE_CREDENTIAL_MASTER_KEY_FILE="$RUNNER_TEMP/hope-e2e-master-key"
          export HOPE_AGENT_RELEASE_DIR="$RUNNER_TEMP/hope-e2e-releases"
          export HOPE_RELEASE_PUBLIC_KEY_FILE="$RUNNER_TEMP/hope-e2e-release-keys/public-key.hex"
          export HOPE_CA_CERT_PATH="$RUNNER_TEMP/hope-e2e-pki/ca-cert.pem"
          export HOPE_CA_KEY_PATH="$RUNNER_TEMP/hope-e2e-pki/ca-key.pem"
          export HOPE_SERVER_CERT_PATH="$RUNNER_TEMP/hope-e2e-pki/server-cert.pem"
          export HOPE_SERVER_KEY_PATH="$RUNNER_TEMP/hope-e2e-pki/server-key.pem"
          ./target/debug/server serve >"$RUNNER_TEMP/hope-e2e-server.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/hope-e2e-server.pid"
          ./target/debug/server worker >"$RUNNER_TEMP/hope-e2e-worker.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/hope-e2e-worker.pid"
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/hope-e2e-server.log"
          exit 1
      - run: pnpm -C apps/web exec playwright install --with-deps chromium
      - run: pnpm -C apps/web test:e2e
      - name: Stop E2E services
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/hope-e2e-worker.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/hope-e2e-worker.pid")" || true
          fi
          if [ -f "$RUNNER_TEMP/hope-e2e-server.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/hope-e2e-server.pid")" || true
          fi
      - name: Show server log
        if: always()
        run: |
          cat "$RUNNER_TEMP/hope-e2e-server.log"
          cat "$RUNNER_TEMP/hope-e2e-worker.log"

  agent-cross-compile:
    name: agent cross-compile, sign, and release bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: taiki-e/install-action@cargo-zigbuild

      - name: Resolve signing key
        env:
          SIGNING_KEY: ${{ secrets.HOPE_RELEASE_SIGNING_KEY_HEX }}
          PUBLIC_KEY: ${{ secrets.HOPE_RELEASE_PUBLIC_KEY_HEX }}
        run: |
          mkdir -p ci-release-keys
          if [ "${{ github.event_name }}" = 'pull_request' ]; then
            cargo run -p xtask -- keygen --out ci-release-keys
          elif [ -n "$SIGNING_KEY" ] && [ -n "$PUBLIC_KEY" ]; then
            printf '%s' "$SIGNING_KEY" > ci-release-keys/signing-key.hex
            printf '%s' "$PUBLIC_KEY" > ci-release-keys/public-key.hex
          else
            echo 'Production publishing requires HOPE_RELEASE_SIGNING_KEY_HEX and HOPE_RELEASE_PUBLIC_KEY_HEX.' >&2
            exit 1
          fi

      - name: Resolve agent release version
        run: |
          version="0.0.${GITHUB_RUN_NUMBER}"
          if [[ "${{ github.ref_type }}" = tag ]]; then version="${GITHUB_REF_NAME#v}"; fi
          echo "HOPE_AGENT_RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build agent (with embedded release public key)
        env:
          HOPE_RELEASE_PUBLIC_KEY_FILE: ${{ github.workspace }}/ci-release-keys/public-key.hex
        run: |
          cargo zigbuild --release -p agent --target x86_64-unknown-linux-musl
          cargo zigbuild --release -p agent --target aarch64-unknown-linux-musl

      - name: Sign release
        run: |
          cargo run -p xtask -- sign \
            --version "$HOPE_AGENT_RELEASE_VERSION" \
            --key ci-release-keys/signing-key.hex \
            --public-key ci-release-keys/public-key.hex \
            --out dist/release \
            --artifact target/x86_64-unknown-linux-musl/release/agent=linux=amd64 \
            --artifact target/aarch64-unknown-linux-musl/release/agent=linux=arm64

      - uses: actions/upload-artifact@v4
        with:
          name: signed-agent-release
          path: dist/release

  docker-build:
    name: build and publish server image
    runs-on: ubuntu-latest
    needs: [rust-checks, web, web-e2e, agent-cross-compile]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: signed-agent-release
          path: dist/release
      - uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=long

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/compose/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
