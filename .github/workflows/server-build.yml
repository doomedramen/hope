name: Server build

# Publishes the server for every push to main as a GitHub release, so installs and updates download
# it instead of compiling (compiling needs about 4 GB of RAM; the server runs in far less). The
# community-scripts container (ct/hope.sh) and scripts/install-hope.sh both take the release GitHub
# marks as latest and its asset hope-server-<x86_64|aarch64>-linux.tar.gz.
#
# Every build has its own version, <major>.<minor>.<run number> from Cargo.toml and this workflow's
# run counter (for example 0.1.57). It is compiled into the agents, named in the package and used as
# the tag (v0.1.57), so both the community-scripts update check and the agent installer see each
# build as newer than the last. Only the newest five builds are kept. Tags created with the workflow
# token start no other workflow, so release.yml (signed releases on v* tags you push yourself) is
# unaffected.
#
# Note: ubuntu-22.04-arm runners are free for public repositories only.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: server-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: version
        env:
          RUN: ${{ github.run_number }}
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          echo "version=${crate%.*}.${RUN}" >> "$GITHUB_OUTPUT"

  agents:
    # Unsigned agents for Linux and macOS, x86_64 and aarch64. Each server signs them with its own key.
    needs: version
    uses: ./.github/workflows/build-agent.yml
    with:
      version: ${{ needs.version.outputs.version }}

  build:
    name: server ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          # The oldest supported glibc, so the binary runs on newer distributions too.
          - { arch: x86_64, runner: ubuntu-22.04 }
          - { arch: aarch64, runner: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
      - run: sh scripts/package-server.sh --out dist/server
        env:
          HOPE_BUILD_VERSION: ${{ needs.version.outputs.version }}
      - name: Smoke-test the packaged binary
        run: |
          mkdir -p "$RUNNER_TEMP/pkg"
          tar -xzf dist/server/hope-server-${{ matrix.arch }}-linux.tar.gz -C "$RUNNER_TEMP/pkg"
          test -f "$RUNNER_TEMP/pkg/web/index.html"
          "$RUNNER_TEMP/pkg/hope-server" export-types | grep -q "export type Host"
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.arch }}
          path: dist/server/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [version, agents, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: server-*
          path: dist/server
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: agent-*
          path: dist/agents
          merge-multiple: true
      - name: Prove the agents can be signed as a server will sign them
        run: |
          umask 077
          openssl genrsa -out "$RUNNER_TEMP/throwaway.pem" 3072 2>/dev/null
          version="${{ needs.version.outputs.version }}"
          HOPE_SIGNING_KEY="$RUNNER_TEMP/throwaway.pem" sh scripts/assemble-release.sh \
            --staging dist/agents --version "$version" --out "$RUNNER_TEMP/signed"
          test -f "$RUNNER_TEMP/signed/current/manifest.json.sig"
      - name: Bundle the agents and merge the checksum files
        run: |
          tar -C dist/agents --owner=0 --group=0 --numeric-owner --sort=name -czf dist/server/hope-agents.tar.gz .
          cd dist/server
          sha256sum hope-agents.tar.gz >> SHA256SUMS-server
          sort -u -k2 SHA256SUMS-server -o SHA256SUMS-server
          sha256sum -c SHA256SUMS-server
          ls -l
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "H.O.P.E build ${VERSION}" \
            --notes "Automatic build of ${GITHUB_SHA::7} on main: the server and console for x86_64 and aarch64 Linux (glibc 2.35 or newer), and unsigned agents for Linux and macOS (hope-agents.tar.gz) that each server signs with its own key. Installed and updated by ct/hope.sh and scripts/install-hope.sh." \
            dist/server/hope-server-*-linux.tar.gz dist/server/hope-agents.tar.gz dist/server/SHA256SUMS-server
      - name: Keep only the newest five builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,name,createdAt \
            --jq '[.[] | select(.name | startswith("H.O.P.E build "))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
            while read -r old; do
              gh release delete "$old" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            done
