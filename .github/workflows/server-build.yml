name: Server build

# Publishes the server after CI passes for a push to main, so installs and updates download it instead
# of compiling (compiling needs about 4 GB of RAM; the server runs in far less). The
# community-scripts container (ct/hope.sh) and scripts/install-hope.sh both take the release GitHub
# marks as latest and its asset hope-server-x86_64-linux.tar.gz. The release also carries
# hope-agents.tar.gz, the x86_64 Linux unsigned agent (build-agent.yml) at the same version and commit; each
# server signs them with its own key (install/hope-install.sh, scripts/install-hope.sh), so no
# signing key is involved here.
#
# Every build has its own version, <major>.<minor>.<run number> from Cargo.toml and this workflow's
# run number, compiled into the agents and written to the package's VERSION file, and used as the
# tag (v0.1.57). So the community-scripts update check sees every build as newer, and the console
# can offer agents older than the server's release an update. Only the newest five builds are
# kept. Tags created with the workflow token start no other workflow, so release.yml (signed agent
# releases on v* tags you push yourself) is unaffected.
#
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: server-build
  cancel-in-progress: false

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  version:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_sha: ${{ steps.version.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - id: version
        env:
          RUN: ${{ github.run_number }}
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          echo "version=${crate%.*}.${RUN}" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  build:
    name: server ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          # The oldest supported glibc, so the binary runs on newer distributions too.
          - { arch: x86_64, runner: ubuntu-22.04 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
      - run: sh scripts/package-server.sh --out dist/server
        env:
          HOPE_BUILD_VERSION: ${{ needs.version.outputs.version }}
      - name: Smoke-test the packaged binary
        run: |
          mkdir -p "$RUNNER_TEMP/pkg"
          tar -xzf dist/server/hope-server-${{ matrix.arch }}-linux.tar.gz -C "$RUNNER_TEMP/pkg"
          test -f "$RUNNER_TEMP/pkg/web/index.html"
          "$RUNNER_TEMP/pkg/hope-server" export-types | grep -q "export type Host"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-${{ matrix.arch }}
          path: dist/server/
          if-no-files-found: error
          retention-days: 7

  agents:
    needs: version
    uses: ./.github/workflows/build-agent.yml
    with:
      version: ${{ needs.version.outputs.version }}
      ref: ${{ needs.version.outputs.source_sha }}

  publish:
    needs: [version, build, agents]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: server-*
          path: dist/server-builds
          merge-multiple: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: agent-*
          path: dist/agents
          merge-multiple: true
      - name: Package the agents
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          version="$VERSION"
          # Prove the Linux x86_64 agent assembles into a release at the server's version before publishing;
          # the throwaway key is discarded, servers sign with their own.
          (umask 077 && openssl genrsa -out "$RUNNER_TEMP/throwaway.pem" 3072 2>/dev/null)
          HOPE_SIGNING_KEY="$RUNNER_TEMP/throwaway.pem" sh scripts/assemble-release.sh --staging dist/agents --version "$version" --out "$RUNNER_TEMP/check"
          rm -rf "$RUNNER_TEMP/throwaway.pem" "$RUNNER_TEMP/check"
          mkdir -p dist/server
          tar -C dist/agents --owner=0 --group=0 --numeric-owner --sort=name -czf dist/server/hope-agents.tar.gz .
      - name: Verify the final server package checksums
        run: |
          sh scripts/assemble-server-release.sh --staging dist/server-builds --out dist/server
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --latest \
            --title "H.O.P.E build ${VERSION}" \
            --notes "Automatic x86_64 Linux build of ${SOURCE_SHA::7} on main: the server and console, and the unsigned Linux x86_64 agent (hope-agents.tar.gz) each server signs with its own key. Installed and updated by ct/hope.sh and scripts/install-hope.sh." \
            dist/server/hope-server-*-linux.tar.gz dist/server/hope-agents.tar.gz dist/server/SHA256SUMS-server
      - name: Keep only the newest five builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Builds are recognised by title ("H.O.P.E build 0.1.57", or "H.O.P.E 0.1.0 build 8" before
          # builds had their own version), so signed releases from release.yml are never touched.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,name,createdAt \
            --jq '[.[] | select(.name | test("^H\\.O\\.P\\.E ([0-9.]+ )?build [0-9.]+$"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
            while read -r old; do
              gh release delete "$old" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            done
