# Reusable: build the unsigned Linux x86_64 agent on a matching runner.
# Called by ci.yml (smoke) and release.yml (artifacts for signing). Holds no secrets and signs nothing.
name: build-agent

on:
  workflow_call:
    inputs:
      version:
        description: Build version compiled into the agents (empty for the crate version)
        type: string
        required: false
        default: ""
      ref:
        description: Git ref to build (defaults to the calling workflow commit)
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-latest, linux: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Install musl toolchain
        if: matrix.linux
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends musl-tools binutils
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
      - name: Build, inspect and smoke-test
        env:
          HOPE_BUILD_VERSION: ${{ inputs.version }}
        run: sh scripts/build-agent.sh "${{ matrix.target }}" --out dist/agents
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-${{ matrix.target }}
          path: dist/agents/
          if-no-files-found: error
          retention-days: 7
