[workspace]
members = ["crates/hope-protocol", "crates/hope-server", "crates/hope-agent"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hope-protocol = { path = "crates/hope-protocol" }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

# Test agents for the updater gate (tests/gates/updater.py), which builds four versions in a row. The
# same code without whole-program optimisation, so each version relinks in seconds. Never published.
[profile.gate]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

# Build-time proc macros are loaded by rustc, not shipped with H.O.P.E. Keep
# their symbols intact to avoid malformed stripped Mach-O libraries on macOS.
[profile.release.build-override]
strip = false
