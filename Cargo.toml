[workspace]
resolver = "3"
members = [
    "apps/server",
    "apps/agent",
    "crates/domain",
    "crates/protocol",
    "crates/jobs",
    "crates/release",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "request-id", "fs", "util"] }
tower-sessions = { version = "0.15", features = ["axum-core"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "json", "migrate"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
figment = { version = "0.10", features = ["env", "toml"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
jiff = { version = "0.1", features = ["serde"] }
argon2 = "0.5"
rand = "0.8"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pemfile = "2"
rustls-pki-types = "1"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
futures-util = "0.3"
time = "0.3"
async-trait = "0.1"
governor = "0.7"
x509-parser = "0.16"
ipnet = "2.12.2"
ed25519-dalek = { version = "2", features = ["rand_core", "serde"] }
rand_core = { version = "0.6", features = ["std", "getrandom"] }

domain = { path = "crates/domain" }
protocol = { path = "crates/protocol" }
jobs = { path = "crates/jobs" }
release = { path = "crates/release" }

[profile.release]
opt-level = "s"
lto = true
strip = true
