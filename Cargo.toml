[workspace]
resolver = "3"
members = [
    "apps/server",
    "apps/agent",
    "crates/domain",
    "crates/protocol",
    "crates/jobs",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "request-id", "fs", "util"] }
tower-sessions = { version = "0.15", features = ["axum-core"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "json", "migrate"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
figment = { version = "0.10", features = ["env", "toml"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
jiff = { version = "0.1", features = ["serde"] }
argon2 = "0.5"
rand = "0.8"

domain = { path = "crates/domain" }
protocol = { path = "crates/protocol" }
jobs = { path = "crates/jobs" }

[profile.release]
opt-level = "s"
lto = true
strip = true
