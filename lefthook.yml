assert_lefthook_installed: true

pre-commit:
  parallel: true
  jobs:
    - name: Rust formatting
      run: cargo fmt --all -- --check
    - name: Web formatting
      run: npm --prefix web run format:check
    - name: Web lint
      run: npm --prefix web run lint

pre-push:
  jobs:
    - name: Workspace checks
      run: make check
    - name: Shell checks
      run: make shell-checks
    - name: Linux Rust checks
      run: make linux-checks
    - name: Generated protocol
      run: make protocol-check
    - name: Installer and release tests
      run: make script-checks docs-tests
    - name: Web build and browser tests
      run: make browser-checks
