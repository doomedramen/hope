services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-hope}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hope}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOPE_DATABASE_URL: ${HOPE_DATABASE_URL:?set HOPE_DATABASE_URL in .env}
      HOPE_BIND_ADDR: 0.0.0.0:8080
      HOPE_COOKIE_SECURE: ${HOPE_COOKIE_SECURE:-true}
      HOPE_CREDENTIAL_MASTER_KEY_FILE: /run/secrets/hope_credential_master_key
      HOPE_AGENT_ENROLL_URL: ${HOPE_AGENT_ENROLL_URL:?set HOPE_AGENT_ENROLL_URL in .env}
      HOPE_AGENT_GATEWAY_URL: ${HOPE_AGENT_GATEWAY_URL:?set HOPE_AGENT_GATEWAY_URL in .env}
      HOPE_AGENT_RELEASE_DIR: /app/agent-releases
      HOPE_RELEASE_PUBLIC_KEY_FILE: ${HOPE_RELEASE_PUBLIC_KEY_FILE:-/app/agent-releases/public-key.hex}
      HOPE_AGENT_BINARY_X86_64: /app/agent-releases/agent-linux-amd64
      HOPE_AGENT_BINARY_AARCH64: /app/agent-releases/agent-linux-arm64
    secrets:
      - hope_credential_master_key
    volumes:
      - server-pki:/app/data/pki
      - ./agent-releases:/app/agent-releases:ro
    ports:
      - "8080:8080"
      - "8443:8443"
      - "8444:8444"
    command: ["serve"]

  worker:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOPE_DATABASE_URL: ${HOPE_DATABASE_URL:?set HOPE_DATABASE_URL in .env}
      HOPE_CREDENTIAL_MASTER_KEY_FILE: /run/secrets/hope_credential_master_key
      HOPE_AGENT_ENROLL_URL: ${HOPE_AGENT_ENROLL_URL:?set HOPE_AGENT_ENROLL_URL in .env}
      HOPE_AGENT_GATEWAY_URL: ${HOPE_AGENT_GATEWAY_URL:?set HOPE_AGENT_GATEWAY_URL in .env}
      HOPE_AGENT_RELEASE_DIR: /app/agent-releases
      HOPE_RELEASE_PUBLIC_KEY_FILE: ${HOPE_RELEASE_PUBLIC_KEY_FILE:-/app/agent-releases/public-key.hex}
      HOPE_AGENT_BINARY_X86_64: /app/agent-releases/agent-linux-amd64
      HOPE_AGENT_BINARY_AARCH64: /app/agent-releases/agent-linux-arm64
    secrets:
      - hope_credential_master_key
    volumes:
      - server-pki:/app/data/pki:ro
      - ./agent-releases:/app/agent-releases:ro
    command: ["worker"]

volumes:
  postgres-data:
  server-pki:

secrets:
  hope_credential_master_key:
    file: ./secrets/credential-master-key
